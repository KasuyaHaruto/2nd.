{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>{{ message }}</p>

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label>
  </p>
  <p>
    <input type="text" id="name" name="name" value="{{ request.form.get('name', '') if request.method == 'POST' else '' }}">
  </p>
  <p><button type="submit">登録</button></p>
</form>
{% endblock %}
